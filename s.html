
<!DOCTYPE html>
<html>
<head>
    <title>My E-Commerce Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
        }

        .box {
            background: white;
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #087f5b;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        #products {
            display: none;
            padding: 20px;
        }

        .product {
            display: inline-block;
            background: white;
            width: 180px;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>My E-Commerce Store</h1>
</header>

<div class="box" id="auth">
    <h2>Sign Up</h2>
    <input id="name" placeholder="Enter name">
    <input id="email" type="email" placeholder="Enter email">
    <input id="password" type="password"
           placeholder="Enter password">
    <button onclick="signup()">Sign Up</button>

    <hr>

    <h2>Login</h2>
    <input id="loginEmail" type="email"
           placeholder="Enter email">
    <input id="loginPassword" type="password"
           placeholder="Enter password">
    <button onclick="login()">Login</button>

    <p id="message"></p>
</div>

<section id="products">
    <h2>Our Products</h2>

    <div class="product">
        <h3>Headphones</h3>
        <p>Price: ₹999</p>
        <button onclick="alert('Headphones added!')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Smart Watch</h3>
        <p>Price: ₹1499</p>
        <button onclick="alert('Smart Watch added!')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Shoes</h3>
        <p>Price: ₹1999</p>
        <button onclick="alert('Shoes added!')">
            Add to Cart
        </button>
    </div>

    <br>
    <button onclick="logout()">Logout</button>
</section>

<script>
function signup() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (!name || !email || !password) {
        message.textContent = "Fill all signup fields!";
        return;
    }

    localStorage.setItem("user", JSON.stringify({
        name: name,
        email: email,
        password: password
    }));

    message.textContent = "Signup successful! Please login.";
}

function login() {
    let user = JSON.parse(localStorage.getItem("user"));

    let email = document.getElementById("loginEmail").value;
    let password = document.getElementById("loginPassword").value;

    if (user && user.email === email &&
        user.password === password) {
        document.getElementById("auth").style.display = "none";
        document.getElementById("products").style.display = "block";
    } else {
        message.textContent = "Invalid email or password!";
    }
}

function logout() {
    document.getElementById("products").style.display = "none";
    document.getElementById("auth").style.display = "block";
}
</script>

</body>
</html>
